version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: no-sql-app
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - REDIS_HOST=redis_db
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      redis_db:
        condition: service_healthy
    networks:
      - backend_net

  redis_db:
    image: redis:7.4-alpine
    container_name: redis-session-store
    restart: always
    command: ["redis-server", "--maxmemory 256mb", "--maxmemory-policy allkeys-lru"]
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge