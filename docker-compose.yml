services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: no-sql-app
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      REDIS_HOST: redis_db
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MONGODB_HOST: mongos_router
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      redis_db:
        condition: service_healthy
      mongo-router-init:
        condition: service_completed_successfully
    networks:
      - backend_net

  redis_db:
    image: redis:7.4-alpine
    container_name: redis-session-store
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend_net

  config1:
    image: mongo:8.0
    container_name: mongo-config1
    command: ["mongod", "--configsvr", "--replSet", "config_rs", "--port", "${MONGO_CONFIG_PORT_1}", "--bind_ip_all"]
    volumes:
      - config1_data:/data/db
    networks:
      - backend_net

  config2:
    image: mongo:8.0
    container_name: mongo-config2
    command: ["mongod", "--configsvr", "--replSet", "config_rs", "--port", "${MONGO_CONFIG_PORT_2}", "--bind_ip_all"]
    volumes:
      - config2_data:/data/db
    networks:
      - backend_net

  config3:
    image: mongo:8.0
    container_name: mongo-config3
    command: ["mongod", "--configsvr", "--replSet", "config_rs", "--port", "${MONGO_CONFIG_PORT_3}", "--bind_ip_all"]
    volumes:
      - config3_data:/data/db
    networks:
      - backend_net

  shard1-a:
    image: mongo:8.0
    container_name: mongo-shard1-a
    command: ["mongod", "--shardsvr", "--replSet", "shard1_rs", "--port", "${MONGO_SHARD1_PORT_A}", "--bind_ip_all"]
    volumes:
      - shard1a_data:/data/db
    networks:
      - backend_net

  shard1-b:
    image: mongo:8.0
    container_name: mongo-shard1-b
    command: ["mongod", "--shardsvr", "--replSet", "shard1_rs", "--port", "${MONGO_SHARD1_PORT_B}", "--bind_ip_all"]
    volumes:
      - shard1b_data:/data/db
    networks:
      - backend_net

  shard1-c:
    image: mongo:8.0
    container_name: mongo-shard1-c
    command: ["mongod", "--shardsvr", "--replSet", "shard1_rs", "--port", "${MONGO_SHARD1_PORT_C}", "--bind_ip_all"]
    volumes:
      - shard1c_data:/data/db
    networks:
      - backend_net

  shard2-a:
    image: mongo:8.0
    container_name: mongo-shard2-a
    command: ["mongod", "--shardsvr", "--replSet", "shard2_rs", "--port", "${MONGO_SHARD2_PORT_A}", "--bind_ip_all"]
    volumes:
      - shard2a_data:/data/db
    networks:
      - backend_net

  shard2-b:
    image: mongo:8.0
    container_name: mongo-shard2-b
    command: ["mongod", "--shardsvr", "--replSet", "shard2_rs", "--port", "${MONGO_SHARD2_PORT_B}", "--bind_ip_all"]
    volumes:
      - shard2b_data:/data/db
    networks:
      - backend_net

  shard2-c:
    image: mongo:8.0
    container_name: mongo-shard2-c
    command: ["mongod", "--shardsvr", "--replSet", "shard2_rs", "--port", "${MONGO_SHARD2_PORT_C}", "--bind_ip_all"]
    volumes:
      - shard2c_data:/data/db
    networks:
      - backend_net

  mongo-init:
    image: mongo:8.0
    container_name: mongo-cluster-init
    env_file: [.env.local]
    depends_on: [config1, config2, config3, shard1-a, shard1-b, shard1-c, shard2-a, shard2-b, shard2-c]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        wait_for_mongo() { until mongosh --host $$1 --port $$2 --eval "db.runCommand({ ping: 1 })" >/dev/null 2>&1; do sleep 2; done; }
        wait_for_primary() { until mongosh --host $$1 --port $$2 --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 2; done; }
        wait_for_mongo config1 ${MONGO_CONFIG_PORT_1}; wait_for_mongo shard1-a ${MONGO_SHARD1_PORT_A}; wait_for_mongo shard2-a ${MONGO_SHARD2_PORT_A}
        mongosh --host config1 --port ${MONGO_CONFIG_PORT_1} --eval "rs.initiate({_id: 'config_rs', configsvr: true, members: [{_id: 0, host: 'config1:${MONGO_CONFIG_PORT_1}'}, {_id: 1, host: 'config2:${MONGO_CONFIG_PORT_2}'}, {_id: 2, host: 'config3:${MONGO_CONFIG_PORT_3}'}]})"
        mongosh --host shard1-a --port ${MONGO_SHARD1_PORT_A} --eval "rs.initiate({_id: 'shard1_rs', members: [{_id: 0, host: 'shard1-a:${MONGO_SHARD1_PORT_A}'}, {_id: 1, host: 'shard1-b:${MONGO_SHARD1_PORT_B}'}, {_id: 2, host: 'shard1-c:${MONGO_SHARD1_PORT_C}'}]})"
        mongosh --host shard2-a --port ${MONGO_SHARD2_PORT_A} --eval "rs.initiate({_id: 'shard2_rs', members: [{_id: 0, host: 'shard2-a:${MONGO_SHARD2_PORT_A}'}, {_id: 1, host: 'shard2-b:${MONGO_SHARD2_PORT_B}'}, {_id: 2, host: 'shard2-c:${MONGO_SHARD2_PORT_C}'}]})"
        wait_for_primary config1 ${MONGO_CONFIG_PORT_1}; wait_for_primary shard1-a ${MONGO_SHARD1_PORT_A}; wait_for_primary shard2-a ${MONGO_SHARD2_PORT_A}
    networks:
      - backend_net

  mongos_router:
    image: mongo:8.0
    container_name: mongo-mongos-router
    depends_on: {mongo-init: {condition: service_completed_successfully}}
    command: ["mongos", "--configdb", "config_rs/config1:${MONGO_CONFIG_PORT_1},config2:${MONGO_CONFIG_PORT_2},config3:${MONGO_CONFIG_PORT_3}", "--bind_ip_all", "--port", "${MONGODB_PORT}"]
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    networks:
      - backend_net

  mongo-router-init:
    image: mongo:8.0
    container_name: mongo-router-init
    env_file: [.env.local]
    depends_on: [mongos_router]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until mongosh --host mongos_router --port ${MONGODB_PORT} --eval "db.runCommand({ ping: 1 })" >/dev/null 2>&1; do sleep 2; done
        mongosh --host mongos_router --port ${MONGODB_PORT} --eval "sh.addShard('shard1_rs/shard1-a:${MONGO_SHARD1_PORT_A},shard1-b:${MONGO_SHARD1_PORT_B},shard1-c:${MONGO_SHARD1_PORT_C}'); sh.addShard('shard2_rs/shard2-a:${MONGO_SHARD2_PORT_A},shard2-b:${MONGO_SHARD2_PORT_B},shard2-c:${MONGO_SHARD2_PORT_C}');"
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  config1_data:
  config2_data:
  config3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data: