services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: no-sql-app
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - REDIS_HOST=redis_db
      - REDIS_PORT=${REDIS_PORT}
      - MONGODB_HOST=mongo_db
      - MONGODB_PORT=${MONGODB_PORT}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - MONGODB_USER=${MONGODB_USER}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      redis_db:
        condition: service_healthy
      mongo_db:
        condition: service_healthy
    networks:
      - backend_net

  redis_db:
    image: redis:7.4-alpine
    container_name: redis-session-store
    restart: always
    command: [ "redis-server", "--maxmemory 256mb", "--maxmemory-policy allkeys-lru" ]
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend_net
  mongo_db:
    image: mongo:8.0
    container_name: mongodb-data-store
    restart: always
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "${MONGODB_PORT}", "--eval", "db.adminCommand('ping')" ]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  mongo_data: